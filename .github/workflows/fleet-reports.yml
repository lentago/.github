name: Weekly fleet reports

# Regenerates fleet-reports/fleet-report.md (issue report, site error budgets, code census)
# and fleet-reports/epics.md (tracking issues, their sub-issue progress, and the
# merged work attributed to each) from the fleet's public state, plus
# fleet-reports/incidents.md (the incident register, rebuilt from the local report
# files under fleet-reports/incidents/), and opens an auto-merging refresh PR.
#
# Auth: the org disallows GITHUB_TOKEN from creating PRs, so this uses a
# fine-grained PAT stored as the repo secret FLEET_REPORTS_TOKEN (resource owner
# `lentago`, repo `.github`, permissions Contents + Pull requests: write). The
# generator's cross-repo reads work because every lentago repo is public.
#
# Site error budgets (lentago/drosera#199): fleet-report.md's error-budget table
# queries drosera's Grafana Cloud stack with a second, optional secret,
# FLEET_REPORTS_GRAFANA_TOKEN. It is passed to the regenerate step only. When it is
# unset the table renders a one-line "not configured" note and the run stays green;
# when it is set but fails (expired, revoked) the table says so and the run warns.
#   Scope: a Grafana service-account token (`glsa_…`) under an account with the
#   built-in Viewer role, which is enough to query the `grafanacloud-prom` data
#   source through /api/datasources/proxy and can change nothing. Not a Cloud
#   access-policy token and not the `terraform-iac` Admin account.
#   Creating it (ADR-0011 rule 4: Terraform holds the slot, the value is set by hand):
#     1. In lentago/drosera, add to terraform/service_accounts.tf (and its row to
#        terraform/README.md § Service accounts), and merge so CI applies it:
#          resource "grafana_service_account" "fleet_reports_viewer" {
#            name        = "fleet-reports-viewer"
#            role        = "Viewer"
#            is_disabled = false
#          }
#     2. In https://lentago.grafana.net, Administration → Users and access →
#        Service accounts → fleet-reports-viewer → Add service account token,
#        named `lentago/.github fleet-reports`. Copy it (shown once).
#     3. Store it without echoing it:
#          gh secret set FLEET_REPORTS_GRAFANA_TOKEN --repo lentago/.github
#        (paste at the prompt). Record any expiry in the credential register (#243).
#     4. Run this workflow by hand (workflow_dispatch) and check that the refresh PR's
#        fleet-report.md shows the table rather than the note (ADR-0011 rule 5).
#   Rotate: mint a new token, `gh secret set` again, delete the old token.
#   Revoke: delete the token in the stack; the table falls back to an error note.

on:
  schedule:
    # Mondays 12:00 UTC = 08:00 EDT (07:00 EST). GitHub runs schedules in UTC.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fleet-reports
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FLEET_REPORTS_TOKEN }}
    steps:
      - name: Require the PAT secret
        run: |
          if [ -z "${{ secrets.FLEET_REPORTS_TOKEN }}" ]; then
            echo "::error::FLEET_REPORTS_TOKEN is not set. Create a fine-grained PAT" \
                 "(owner lentago, repo .github, Contents + Pull requests: write) and" \
                 "store it: gh secret set FLEET_REPORTS_TOKEN --repo lentago/.github"
            exit 1
          fi

      - name: Checkout .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.FLEET_REPORTS_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Install cloc (pinned to v2.06)
        # ubuntu-latest's apt archive resolves to cloc 1.98, which doesn't recognise
        # .astro or Jinja templates and silently drops both from the census instead
        # of miscategorizing them (issue #78). Fetch the tagged release script and
        # verify it against a recorded sha256 so CI and local regens stay in lockstep.
        run: |
          curl -fsSL -o /tmp/cloc-2.06.pl \
            https://github.com/AlDanial/cloc/releases/download/v2.06/cloc-2.06.pl
          echo "ed9fbdd081a2ceb933ea490b3c1cfacc87d3898ae2650d0d6756439695a836c8  /tmp/cloc-2.06.pl" | sha256sum -c -
          sudo install -m 0755 /tmp/cloc-2.06.pl /usr/local/bin/cloc

      - name: Regenerate reports
        env:
          # Optional; empty when the secret is unset. See the header.
          FLEET_REPORTS_GRAFANA_TOKEN: ${{ secrets.FLEET_REPORTS_GRAFANA_TOKEN }}
        run: python3 metrics/generate-fleet-reports.py --out-dir .

      - name: Open auto-merging PR if anything changed
        run: |
          set -euo pipefail
          FILES="fleet-reports/fleet-report.md fleet-reports/epics.md fleet-reports/incidents.md"
          if git diff --quiet -- $FILES; then
            echo "No changes this week — nothing to publish."
            exit 0
          fi
          D=$(date -u +%F)
          BR="fleet-reports-refresh-$D"
          git config user.name  "lentago-fleet-bot"
          git config user.email "chris@lentago.dev"
          git switch -c "$BR"
          git add $FILES
          git commit -m "Weekly fleet reports refresh — $D" \
                     -m "Co-Authored-By: Claude Opus 4.8 (1M context) <noreply@anthropic.com>"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "Weekly fleet reports refresh — $D" \
            --body "Automated weekly regeneration of \`fleet-reports/fleet-report.md\` (combined issue report + code census, from public GitHub metadata + \`cloc\`), \`fleet-reports/epics.md\` (tracking issues, sub-issue progress, and the merged PRs attributed to each) and \`fleet-reports/incidents.md\` (the incident register, from the report files under \`fleet-reports/incidents/\`). Produced by \`.github/workflows/fleet-reports.yml\`."
          # Arm auto-merge; fall back to an immediate squash if auto-merge can't arm.
          gh pr merge "$BR" --auto --squash --delete-branch \
            || gh pr merge "$BR" --squash --delete-branch

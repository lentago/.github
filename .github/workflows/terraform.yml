# ============================================================================
# terraform — fleet repo settings as code
# ============================================================================
# Validates the terraform/ module that owns every Lentago Labs repo's settings.
#
# PHASE 2 (wiring, gate not yet required): plan-on-PR + apply-on-merge are wired
# below, following drosera's GitHub-hosted shape — the GitHub API is internet-
# reachable, unlike the Proxmox repos (kalmia/claytonia) whose provider is LAN-
# only and must run on the self-hosted runner. Both jobs need two credentials:
#   - AWS via OIDC (role dotgithub-github-actions-terraform) for the S3 state backend
#   - the GitHub provider token from the FLEET_ADMIN_TOKEN repo secret
# Until FLEET_ADMIN_TOKEN is minted, plan/apply fail at their secret preflight.
# That is deliberately safe: `gate` is NOT yet in fleet-ops/required-checks.json,
# so a red plan cannot block a merge. Requiring `gate` is the final step, taken
# only after a green plan is observed on a real PR. See terraform/README.md
# § Phases and issue #81.
#
# Deliberately NOT path-filtered at the `on:` level for pull_request. The `gate`
# job below is shaped to become a required status check in phase 2, and a
# required check whose workflow never triggers is held "Expected" forever,
# deadlocking every non-matching PR (the hard rule in fleet-ops/required-
# checks.json). The filter lives in the `changes` job instead, so the workflow
# always reports a conclusion while the real work skips on unrelated PRs — a
# skipped job counts as passing. `push` keeps its filter.
# ============================================================================

name: terraform

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "fleet-ops/*.json"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read
  pull-requests: write # plan job posts its output as a PR comment
  issues: write # createComment goes through the issues API
  id-token: write # OIDC → AWS for the S3 state backend (plan + apply jobs)

env:
  TERRAFORM_VERSION: "1.14.9"
  # OIDC role (least-privilege: this repo's S3 state key + the lock table only).
  # Minted in solidago, trusting repo:lentago/.github. See terraform/README.md § Phases.
  AWS_ROLE: arn:aws:iam::365184644049:role/dotgithub-github-actions-terraform
  AWS_REGION: us-east-1

jobs:
  # Replaces the former `on:`-level path filter for PRs. On push the filter
  # above already guaranteed a relevant change, so report true.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tf: ${{ steps.filter.outputs.tf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect terraform changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "tf=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "changed files:"; echo "$changed"
          # fleet-ops/*.json is in scope: the module reads repos.json,
          # labels.json and required-checks.json, so editing one of those is a
          # terraform change even when no .tf file moved.
          if echo "$changed" | grep -qE '^terraform/|^fleet-ops/.*\.json$|^\.github/workflows/terraform\.yml$'; then
            echo "tf=true" >> "$GITHUB_OUTPUT"
          else
            echo "tf=false" >> "$GITHUB_OUTPUT"
          fi

  # Named tf-validate, not validate: a job id becomes the check-run context, and
  # ci.yml already publishes `validate` — which is a REQUIRED context on this
  # repo. Two check runs sharing a required name make "did validate pass?"
  # ambiguous, and this repo has been bitten before by contexts that were not
  # exactly what they looked like (see fleet-ops/required-checks.json).
  tf-validate:
    needs: changes
    if: needs.changes.outputs.tf == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init (no backend)
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate -no-color

  # plan-on-PR. GitHub-hosted runner (the GitHub + AWS APIs are both internet-
  # reachable), OIDC → AWS for the S3 backend, GitHub provider token from the
  # FLEET_ADMIN_TOKEN repo secret. Posts the plan to the PR; a failed plan fails
  # the job, which turns `gate` red.
  plan:
    needs: [changes, tf-validate]
    runs-on: ubuntu-latest
    # Dependabot PRs are excluded: a `pull_request` run triggered by Dependabot
    # draws from a separate Dependabot secrets store, not this repo's normal
    # Actions secrets, so FLEET_ADMIN_TOKEN resolves empty and the preflight
    # below fails by design. A dependency bump (an action SHA pin) never needs to
    # plan against the fleet, so skip the job rather than widen where the admin
    # credential is reachable. A skipped job counts as passing for the `gate`
    # fan-in. Same pattern as kalmia/claytonia (see lentago/.github#114).
    if: >-
      needs.changes.outputs.tf == 'true' &&
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: terraform
    env:
      # The integrations/github provider reads $GITHUB_TOKEN; override the default
      # Actions token with the fleet admin PAT (repo administration + org repo
      # creation across all repos). Never `delete_repo` — README.md § Rails.
      GITHUB_TOKEN: ${{ secrets.FLEET_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify FLEET_ADMIN_TOKEN
        run: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLEET_ADMIN_TOKEN (see terraform/README.md § Auth). It was empty in this run."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC → S3 state)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false

      - name: plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -lock=false \
            -out=tfplan 2>&1 | tee plan.txt
          PLAN_EXIT=${PIPESTATUS[0]}
          {
            echo 'plan<<EOF'
            tail -c 60000 plan.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$PLAN_EXIT"

      - name: comment on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const plan = process.env.PLAN || '(no plan output captured)';
            const outcome = process.env.OUTCOME;
            const body = [
              `### terraform plan (${outcome})`,
              '```',
              plan,
              '```',
            ].join('\n');
            return github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if terraform plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # apply-on-merge. Same credentials as plan, -auto-approve. Path-gated at the
  # `on: push` level above so a merge that touched no terraform/config never
  # re-applies.
  apply:
    needs: [changes, tf-validate]
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.tf == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize applies so two quick merges can't race on the same state.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform
    env:
      GITHUB_TOKEN: ${{ secrets.FLEET_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify FLEET_ADMIN_TOKEN
        run: |
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "::error::Set repository secret FLEET_ADMIN_TOKEN (see terraform/README.md § Auth). It was empty in this run."
            exit 1
          fi

      - name: Configure AWS credentials (OIDC → S3 state)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: init
        run: terraform init -input=false

      - name: apply
        run: terraform apply -auto-approve -no-color -input=false

  # Always-on fan-in. This is the context phase 2 adds to required-checks.json:
  # it reports on every PR (green when the terraform jobs skipped), so requiring
  # it cannot deadlock a docs-only PR.
  gate:
    needs: [changes, tf-validate, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          # needs['tf-validate'], not needs.tf-validate — a hyphen in a context
          # key parses as subtraction in an expression.
          echo "changes=${{ needs.changes.result }} tf-validate=${{ needs['tf-validate'].result }} plan=${{ needs.plan.result }}"
          # A skipped dependency is a pass (docs-only PR, or plan skipped on push /
          # for dependabot); only a real failure or cancellation fails the gate.
          # A failed plan lands here as `failure`, which is what will block the
          # merge once `gate` is added to required-checks.json (issue #81 step 4).
          for r in "${{ needs.changes.result }}" "${{ needs['tf-validate'].result }}" "${{ needs.plan.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::terraform checks did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "terraform gate: ok"
